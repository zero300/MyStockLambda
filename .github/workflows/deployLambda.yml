# .github/workflows/deploy.yml
name: Deploy Node.js Lambda
on:
  push:
    branches: [main]

permissions:
  id-token: write # OIDC 必要
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Package
        run: |
          zip -r function.zip . \
            -x ".git/*" ".github/*" "*.md" "tests/*" "function.zip"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Update Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://function.zip \
            --publish

      - name: Wait until update finished
        run: aws lambda wait function-updated --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}

      - name: Invoke function
        run: |
          RESULT=$(aws lambda invoke \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --invocation-type RequestResponse \
            --cli-binary-format raw-in-base64-out \
            --payload '{"test": true}' \
            --log-type Tail \
            --output json \
            response.json)

          echo "=== Invoke result ==="
          echo "$RESULT" | jq '{StatusCode, ExecutedVersion, FunctionError}'

          echo "=== Function logs ==="
          echo "$RESULT" | jq -r '.LogResult' | base64 -d

          echo "=== Response body ==="
          cat response.json
